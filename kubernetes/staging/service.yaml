apiVersion: v1
kind: Service
metadata:
  name: devsecops-app-service
  namespace: tp-devsecops-staging
  labels:
    app: devsecops-app
    environment: staging
spec:
  type: LoadBalancer  # LoadBalancer pour accès externe, peut être changé en NodePort selon le cluster
  selector:
    app: devsecops-app
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
  sessionAffinity: ClientIP
